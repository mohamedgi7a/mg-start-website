<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MG START | دخول لوحة التحكم</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="admin-body">
    <main class="admin-login-shell">
      <form class="admin-login-card" id="adminLoginForm">
        <img src="../assets/logo.png" alt="MG START" />
        <h1>دخول لوحة التحكم</h1>
        <p>أدخل بيانات حساب الأدمن لإدارة العروض والمشاريع.</p>
        <label>
          البريد الإلكتروني
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          كلمة المرور
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary" type="submit">تسجيل الدخول</button>
        <div class="admin-message" data-login-status></div>
      </form>
    </main>
    <script type="module" src="/src/admin/login.ts"></script>
  </body>
</html>
