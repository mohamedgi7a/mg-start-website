<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MG START | إدارة المشاريع</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <img src="/assets/logo.png" alt="MG START" />
        <nav>
          <a href="/admin/">الرئيسية</a>
          <a href="/admin/offers/">إدارة العروض</a>
          <a class="is-active" href="/admin/projects/">إدارة المشاريع</a>
          <button type="button" data-admin-logout>تسجيل الخروج</button>
        </nav>
      </aside>
      <main class="admin-main">
        <header class="admin-header">
          <div>
            <p>المشاريع</p>
            <h1>إدارة المشاريع</h1>
          </div>
          <button class="btn btn-primary btn-small" type="button" data-new-project>إضافة مشروع</button>
        </header>
        <div class="admin-message" data-admin-status></div>
        <section class="admin-panel">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>المشروع</th>
                  <th>النوع</th>
                  <th>الحالة</th>
                  <th>الترتيب</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody id="projectsTable">
                <tr><td colspan="5">جاري التحميل...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="admin-editor" id="projectEditor" hidden>
          <form id="projectForm">
            <input type="hidden" name="id" />
            <input type="hidden" name="image_path" />
            <div class="admin-editor-head">
              <h2 data-editor-title>إضافة مشروع</h2>
              <button type="button" class="admin-close" data-close-editor>إغلاق</button>
            </div>
            <div class="admin-form-grid">
              <label>slug *<input name="slug" required /></label>
              <label>العنوان العربي *<input name="title_ar" required /></label>
              <label>English title<input name="title_en" /></label>
              <label>اسم العميل عربي<input name="client_name_ar" /></label>
              <label>Client name English<input name="client_name_en" /></label>
              <label>النوع العربي *<input name="type_ar" required /></label>
              <label>English type<input name="type_en" /></label>
              <label>الرابط الخارجي<input name="external_url" type="url" /></label>
              <label>CTA عربي<input name="cta_label_ar" value="عرض المشروع" /></label>
              <label>CTA English<input name="cta_label_en" value="View project" /></label>
              <label>ترتيب المشروع<input name="sort_order" type="number" value="0" /></label>
              <label>Alt عربي<input name="image_alt_ar" /></label>
              <label>Alt English<input name="image_alt_en" /></label>
              <label class="admin-wide">الوصف العربي<textarea name="description_ar"></textarea></label>
              <label class="admin-wide">English description<textarea name="description_en"></textarea></label>
              <label class="admin-wide">صورة المشروع<input name="image" type="file" accept="image/png,image/jpeg,image/webp" /></label>
              <div class="admin-wide image-preview" data-image-preview></div>
              <label class="admin-check"><input name="is_featured" type="checkbox" /> مشروع مميز</label>
              <label class="admin-check"><input name="is_published" type="checkbox" checked /> منشور</label>
            </div>
            <div class="admin-actions">
              <button class="btn btn-primary" type="submit">حفظ المشروع</button>
              <button class="btn btn-secondary" type="button" data-close-editor>إلغاء</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/src/admin/projects.ts"></script>
  </body>
</html>
